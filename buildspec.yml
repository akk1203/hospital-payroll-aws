version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto21
    commands:
      - pip install --upgrade aws-sam-cli
  build:
    commands:
      - java -version
      - mvn -f api/pom.xml -DskipTests package
  post_build:
    commands:
      - chmod +x scripts/sam-deploy.sh
      - ./scripts/sam-deploy.sh
      - API_URL=$(aws cloudformation describe-stacks --stack-name "$APP_STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" --output text)
      - UI_BUCKET=$(aws cloudformation describe-stacks --stack-name "$APP_STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='UiBucketName'].OutputValue" --output text)
      - UI_URL=$(aws cloudformation describe-stacks --stack-name "$APP_STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='UiUrl'].OutputValue" --output text)
      - printf 'window.PAYROLL_API = "%s/api";\n' "$API_URL" > ui/config.js
      - aws s3 sync ui/ "s3://$UI_BUCKET" --delete --exclude "*.md"
      - echo Test stage API $API_URL
      - echo Test stage UI $UI_URL
