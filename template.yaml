AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Hospital payroll on-demand API (Quarkus Java 21 Lambda + SnapStart, DynamoDB, Cognito)

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues: [dev, test, prod]
  CognitoDomainPrefix:
    Type: String
    Description: Globally unique Cognito hosted UI prefix
  GoogleClientId:
    Type: String
    Default: ""
  GoogleClientSecret:
    Type: String
    Default: ""
    NoEcho: true
  DemoResetEnabled:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]

Conditions:
  HasGoogle: !Not [!Equals [!Ref GoogleClientId, ""]]
  IsProd: !Equals [!Ref EnvironmentName, prod]

Globals:
  Function:
    Timeout: 60
    MemorySize: 1769
    Runtime: java21
    Architectures: [x86_64]

Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowHeaders: ["Authorization", "Content-Type"]
        AllowMethods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
      Auth:
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          CognitoJwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience:
                - !Ref ApiUserPoolClient
                - !Ref UiUserPoolClient

  EmployeesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  BatchesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  PayslipsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: month
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: MonthIndex
          KeySchema:
            - AttributeName: month
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  AdjustmentsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: employeeId
          AttributeType: S
        - AttributeName: date
          AttributeType: S
      KeySchema:
        - AttributeName: employeeId
          KeyType: HASH
        - AttributeName: date
          KeyType: RANGE

  MappingsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: sourceNameNormalized
          AttributeType: S
      KeySchema:
        - AttributeName: sourceNameNormalized
          KeyType: HASH

  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  UiBucket:
    Type: AWS::S3::Bucket
    Properties:
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["*"]
            AllowedMethods: [GET, HEAD]
            AllowedOrigins: ["*"]
            MaxAge: 3000

  UiBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref UiBucket
      PolicyDocument:
        Statement:
          - Sid: PublicReadUi
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub ${UiBucket.Arn}/*

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub ${AWS::StackName}-users
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: false
          RequireNumbers: false
          RequireSymbols: false
          RequireUppercase: false
      Schema:
        - Name: email
          Required: true
          Mutable: true
        - Name: name
          Required: false
          Mutable: true

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref UserPool

  GoogleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Condition: HasGoogle
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: openid email profile
      AttributeMapping:
        email: email
        name: name

  ApiUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: true
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH
      PreventUserExistenceErrors: ENABLED
      SupportedIdentityProviders: [COGNITO]

  UiUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn:
      - UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [implicit]
      AllowedOAuthScopes: [openid, email, profile]
      CallbackURLs:
        - http://localhost
      LogoutURLs:
        - http://localhost
      SupportedIdentityProviders: [COGNITO]
      PreventUserExistenceErrors: ENABLED

  PayrollFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-api
      Handler: io.quarkus.amazon.lambda.runtime.QuarkusStreamHandler::handleRequest
      CodeUri: api/target/function.zip
      AutoPublishAlias: live
      SnapStart:
        ApplyOn: PublishedVersions
      Environment:
        Variables:
          EMPLOYEES_TABLE: !Ref EmployeesTable
          BATCHES_TABLE: !Ref BatchesTable
          PAYSLIPS_TABLE: !Ref PayslipsTable
          ADJUSTMENTS_TABLE: !Ref AdjustmentsTable
          MAPPINGS_TABLE: !Ref MappingsTable
          DATA_BUCKET: !Ref DataBucket
          COGNITO_CLIENT_ID: !Ref ApiUserPoolClient
          COGNITO_CLIENT_SECRET: !GetAtt ApiUserPoolClient.ClientSecret
          COGNITO_USER_POOL_ID: !Ref UserPool
          COGNITO_HOSTED_UI_DOMAIN: !Sub https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com
          COGNITO_HOSTED_UI_CLIENT_ID: !Ref UiUserPoolClient
          COGNITO_GOOGLE_ENABLED: !If [HasGoogle, "true", "false"]
          UI_ORIGIN: !GetAtt UiBucket.WebsiteURL
          DEMO_RESET_ENABLED: !If [IsProd, "false", !Ref DemoResetEnabled]
          PAYROLL_ENVIRONMENT: !Ref EnvironmentName
          JAVA_TOOL_OPTIONS: -XX:+TieredCompilation -XX:TieredStopAtLevel=1
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EmployeesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref BatchesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PayslipsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AdjustmentsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref MappingsTable
        - S3CrudPolicy:
            BucketName: !Ref DataBucket
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:SignUp
                - cognito-idp:InitiateAuth
              Resource: "*"
            - Effect: Allow
              Action:
                - cognito-idp:AdminConfirmSignUp
                - cognito-idp:AdminGetUser
              Resource: !GetAtt UserPool.Arn
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:Scan
              Resource:
                - !Sub ${PayslipsTable.Arn}/index/*
      Events:
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY
            PayloadFormatVersion: "2.0"
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /
            Method: ANY
            PayloadFormatVersion: "2.0"
        PublicConfig:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/auth/config
            Method: GET
            Auth:
              Authorizer: NONE
            PayloadFormatVersion: "2.0"
        PublicLogin:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/auth/login
            Method: POST
            Auth:
              Authorizer: NONE
            PayloadFormatVersion: "2.0"
        PublicSignup:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/auth/signup
            Method: POST
            Auth:
              Authorizer: NONE
            PayloadFormatVersion: "2.0"

Outputs:
  ApiUrl:
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
  UiUrl:
    Value: !GetAtt UiBucket.WebsiteURL
  UiBucketName:
    Value: !Ref UiBucket
  UserPoolId:
    Value: !Ref UserPool
  FunctionName:
    Value: !Ref PayrollFunction
  FunctionAlias:
    Value: live
