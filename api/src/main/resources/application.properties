quarkus.banner.enabled=false
quarkus.package.jar.type=legacy-jar
quarkus.snapstart.enable=true
quarkus.jackson.write-dates-as-timestamps=false
quarkus.jackson.fail-on-unknown-properties=false
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.headers=Authorization,Content-Type
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS

payroll.aws.employees-table=${EMPLOYEES_TABLE:Employees}
payroll.aws.batches-table=${BATCHES_TABLE:Batches}
payroll.aws.payslips-table=${PAYSLIPS_TABLE:Payslips}
payroll.aws.adjustments-table=${ADJUSTMENTS_TABLE:Adjustments}
payroll.aws.mappings-table=${MAPPINGS_TABLE:Mappings}
payroll.aws.advances-table=${ADVANCES_TABLE:Advances}
payroll.aws.data-bucket=${DATA_BUCKET:payroll-data}

payroll.cognito.client-id=${COGNITO_CLIENT_ID:}
payroll.cognito.client-secret=${COGNITO_CLIENT_SECRET:}
payroll.cognito.user-pool-id=${COGNITO_USER_POOL_ID:}
payroll.cognito.hosted-ui-domain=${COGNITO_HOSTED_UI_DOMAIN:}
payroll.cognito.hosted-ui-client-id=${COGNITO_HOSTED_UI_CLIENT_ID:}
payroll.cognito.google-enabled=${COGNITO_GOOGLE_ENABLED:false}
payroll.ui.origin=${UI_ORIGIN:}

payroll.demo.reset-enabled=${DEMO_RESET_ENABLED:true}
payroll.environment=${PAYROLL_ENVIRONMENT:dev}
